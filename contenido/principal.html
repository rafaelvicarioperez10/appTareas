<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>principal</title>
    <link rel="stylesheet" href="../css/Estilos.css">
    <!-- el .. en la ruta indica que se sube un nivel en la estructura de carpetas para acceder a la carpeta css -->
</head>

<body onload="cargarUsuario()">
    <div class="container">
        <h1>Bienvenido a la página principal</h1>
        <p id="mensaje"></p>
        <h2>
            Mi lista de tareas
        </h2>
        <div>
            <input required type="text" id="tarea" placeholder="Ingrese una tarea">
            <button id="agregar" onclick="agregarTarea()">Agregar</button>
        </div>
        <div id="sinTareas" class="sin-tareas">
            <p>No hay tareas pendientes</p>
            <span> Añade una tarea</span>
            <span emoji>📝</span>
        </div>
        <ul id="listaTareas">
           <!-- Aquí se agregarán las tareas dinámicamente con javascript -->   
        </ul>

    </div>
    <script src="../js/funcionalidad.js"></script>
</body>

</html>
